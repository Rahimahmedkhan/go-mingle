name: gomingle_customer_mobile
description: GoMingle customer mobile app
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  bloc: ^8.1.2
  easy_localization: ^3.0.3
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  flutter_ether_2:
    git:
      url: git@bitbucket.org:venturedive/ethr-flutter-sdk.git
      ref: master
  formz: ^0.6.1
  go_router: ^12.1.3
  hive: ^2.2.3
  http: ^1.1.2
  http_interceptor: ^2.0.0-beta.7
  intl: ^0.20.0
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.2
  very_good_analysis: ^5.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/brand/
    - assets/translations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/bricolage_grotesque/BricolageGrotesque-Regular.ttf
        - asset: assets/fonts/bricolage_grotesque/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/bricolage_grotesque/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/bricolage_grotesque/BricolageGrotesque-ExtraBold.ttf
          weight: 800
