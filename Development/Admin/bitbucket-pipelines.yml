image: node:20

definitions:
  steps:
    - step: &jenkins-trigger
        name: "Trigger Jenkins only on dev --> qa"
        size: 4x
        runtime:
         cloud:
           atlassian-ip-ranges: true        
        image: alpine:latest
        script:
          - apk add --no-cache curl jq bash
          - |
            set -e

            # ✅ ONLY allow dev → qa PRs
            if [ "${BITBUCKET_BRANCH}" != "dev" ] || [ "${BITBUCKET_PR_DESTINATION_BRANCH}" != "qa" ]; then
              echo "Skipping Jenkins trigger: only dev → qa PRs are allowed."
              exit 0
            fi

            # JENKINS CONFIG
            JENKINS_USER="admin"
            JENKINS_TOKEN="${JENKINS_TOKEN}"
            JENKINS_URL="${JENKINS_URL}"
            JOB_NAME="ci-cd-automation-gomingle"

            # PR METADATA
            PR_ID="${BITBUCKET_PR_ID}"
            #SOURCE_BRANCH="${BITBUCKET_PR_SOURCE_BRANCH}"
            TARGET_BRANCH="${BITBUCKET_PR_DESTINATION_BRANCH}"
            COMMIT="${BITBUCKET_COMMIT}"

            echo "PR #$PR_ID"
            echo "Source: $SOURCE_BRANCH → Target: $TARGET_BRANCH"
            echo "Commit: $COMMIT"

            # TRIGGER JENKINS
            QUEUE_URL=$(curl -k -s -i -X POST \
              "${JENKINS_URL}/job/${JOB_NAME}/buildWithParameters" \
              -u "${JENKINS_USER}:${JENKINS_TOKEN}" \
              --data-urlencode "SOURCE_BRANCH=${BITBUCKET_BRANCH}" \
              --data-urlencode "TARGET_BRANCH=${TARGET_BRANCH}" \
              --data-urlencode "COMMIT=${COMMIT}" \
              --data-urlencode "COMPONENT_KEY=gomingle-frontend" \
              --data-urlencode "REPO_NAME=${BITBUCKET_REPO_SLUG}" \
              --data-urlencode "IS_NIGHTLY_RUN=false" \
              | grep -i Location | awk '{print $2}' | tr -d '\r\n')

            if [ -z "$QUEUE_URL" ]; then
              echo "Jenkins trigger failed"
              exit 1
            fi

            echo "Jenkins queued at: $QUEUE_URL"


    - step: &sonarqube-scan
        size: 2x
        name: SonarQube Scan
        script:
          - npm ci
          - npm run test:coverage

          - pipe: sonarsource/sonarqube-scan:4.0.0
            variables:
              SONAR_HOST_URL: $SONAR_HOST_URL
              SONAR_TOKEN: $SONAR_TOKEN
              EXTRA_ARGS: >
                -Dsonar.projectKey=$SONAR_PROJECT_KEY
                -Dsonar.sources=src
                -Dsonar.tests=src
                -Dsonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx,src/test/**
                -Dsonar.exclusions=dist/**,node_modules/**,coverage/**,src/**/*.d.ts,src/data/mock/**,src/shared/i18n/**,src/test/**,src/modules/disputes/**,src/modules/trust-safety/**,src/modules/students/**,src/modules/settings/**
                -Dsonar.coverage.exclusions=src/main.tsx,src/App.tsx,src/**/index.ts,src/**/index.tsx,src/**/*.d.ts,src/mocks/**,src/locales/**,src/test/**,src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx,src/**/types.ts,src/**/types/**,src/**/constants/**,src/**/routes.tsx,src/ant-design-icons.d.ts
                -Dsonar.typescript.tsconfigPath=tsconfig.json
                -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

    - step: &check-quality-gate-sonarqube
        name: Check Quality Gate
        size: 2x
        script:
          - pipe: sonarsource/sonarqube-quality-gate:1.1.0
            variables:
              SONAR_TOKEN: ${SONAR_TOKEN}
    - step: &deploy-to-s3
        name: Build and deploy to S3
        oidc: true
        caches:
          - node
        script:
          - npm ci
          - export VITE_API_BASE_URL="$VITE_API_BASE_URL"
          - npm run build
          - pipe: atlassian/aws-s3-deploy:1.1.0
            variables:
              AWS_OIDC_ROLE_ARN: $AWS_ROLE_ARN
              AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
              S3_BUCKET: $S3_BUCKET
              LOCAL_PATH: "dist"
          - pipe: atlassian/aws-cloudfront-invalidate:0.12.0
            variables:
              AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
              AWS_OIDC_ROLE_ARN: $AWS_ROLE_ARN
              DISTRIBUTION_ID: $DISTRIBUTION_ID 

pipelines:
  pull-requests:
    '**':
      - step: *jenkins-trigger
  branches:
    dev:
      - step: *sonarqube-scan
      - step: *check-quality-gate-sonarqube
      - step: *jenkins-trigger     
      - stage:
          name: Deploy to dev
          deployment: Develop
          steps:
            - step: *deploy-to-s3

    qa:
      - step: *sonarqube-scan
      - step: *check-quality-gate-sonarqube
      - stage:
          name: Deploy to qa
          deployment: QA
          steps:
            - step: *deploy-to-s3

    uat:
      - stage:
          name: Deploy to uat
          deployment: UAT
          steps:
            - step: *deploy-to-s3